[package]
name = "rsk-consensus"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Rootstock consensus types and header validation, vendored from rustock-core (MIT)"

[dependencies]
alloy-primitives = { version = "1.5.4", features = ["serde", "rlp"] }
alloy-rlp = { version = "0.3.13", features = ["derive"] }
anyhow = "1.0.104"
bitcoin = "0.32.8"
hex-literal = "0.4.1"
k256 = { version = "0.13.4", features = ["ecdsa"] }
serde = { version = "1.0.228", features = ["derive"] }
sha2 = "0.10.9"
sha3 = "0.10.8"
ripemd = "0.1"
thiserror = "2.0.18"

[dev-dependencies]
hex = "0.4.3"