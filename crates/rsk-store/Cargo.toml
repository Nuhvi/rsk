[package]
name = "rsk-store"
version = "0.1.0"
edition = "2024"
description = "Persistent storage for Bitcoin and Rootstock headers"

[dependencies]
rsk = { path = "../rsk" }
redb = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
primitive-types = { version = "0.13.1", features = ["std", "serde"] }
bitcoin = { version = "0.32", features = ["serde"] }

[lints.clippy]
unwrap_used = "deny"
