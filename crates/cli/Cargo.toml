[package]
name = "rsk-cli"
version = "0.1.0"
edition = "2024"
description = "Command line for the RSK One node: talk to real peers, sync headers, stay live"

[dependencies]
anyhow = "1.0.104"
bitcoin = "0.32.8"
btc-p2p = { path = "../btc-p2p" }
clap = { version = "4", features = ["derive"] }
hex = "0.4.3"
rsk-core = { path = "../core" }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

[lints.clippy]
unwrap_used = "deny"
