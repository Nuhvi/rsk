[package]
name = "rsk-p2p"
version = "0.1.0"
edition = "2024"
description = "RSK P2P header sync using Ethereum devp2p/RLPx protocol"

[[bin]]
name = "rsk-p2p"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["net", "rt-multi-thread", "macros", "time", "io-util"] }
thiserror = "2"
hex = "0.4"
secp256k1 = { version = "0.27", features = ["global-context", "rand-std", "recovery"] }
bytes = "1"
concat-kdf = "0.1"
sha2 = "0.10"
sha3 = "0.10"
aes = "0.8"
ctr = "0.9"
hmac = "0.12"
byteorder = "1"
ethereum-types = "0.14"
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
log = "0.4"
env_logger = "0.11"
alloy-rlp = { version = "0.3", features = ["derive"] }
alloy-primitives = "0.7"
snap = "1"
rsk = { path = "../rsk" }
primitive-types = { version = "0.13.1", features = ["std"] }
rlp = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[lints.clippy]
unwrap_used = "deny"
