[package]
name = "rsk-p2p"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Rootstock P2P wire protocol (RLPx + devp2p + rsk subprotocol), vendored+trimmed from rustock-networking (MIT)"

[dependencies]
alloy-primitives = { version = "1.5.4", features = ["serde", "rlp"] }
alloy-rlp = { version = "0.3.13", features = ["derive"] }
anyhow = "1.0.104"
bytes = "1.9.0"
futures = "0.3.31"
k256 = { version = "0.13.4", features = ["ecdsa", "ecdh"] }
rsk-consensus = { path = "../rsk-consensus" }
serde = { version = "1.0.228", features = ["derive"] }
sha3 = "0.10.8"
tokio = { version = "1.49.0", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
tracing = "0.1.44"
aes = "0.8.4"
ctr = "0.9.2"
hmac = "0.12.1"
sha2 = "0.10.9"

[dev-dependencies]
tempfile = "3.25.0"
uuid = { version = "1.20.0", features = ["v4"] }